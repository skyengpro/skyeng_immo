[project]
name = "skyeng_immo"
authors = [{ name = "SkyEngPro", email = "contact@skyengpro.com" }]
description = "Gestion immobiliere SkyEngPro - occupants, visiteurs, vehicules et places de parking"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

# NOTE: frappe / erpnext / propms are deliberately NOT declared here.
# The bench provides them. Declaring `frappe` makes uv resolve the framework
# itself, and frappe pins pypika to a git URL, which uv rejects for anything
# that is not a direct requirement -- the whole image build then dies with
# exit 167. See skyengpro/propms commit 8c0b1d8.
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "W191"]  # tabs are Frappe house style; see [tool.ruff.format]

[tool.ruff.format]
indent-style = "tab"
