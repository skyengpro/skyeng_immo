name: Linters

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linter-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit (hygiene, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - uses: pre-commit/action@v3.0.1
        env:
          # The hook only scans staged files, which is empty here; the gitleaks job covers CI.
          SKIP: gitleaks

  static:
    name: Static checks (DocType JSON, packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # A bad field_order or an unknown link target only fails at install-app; this runs in seconds.
      - name: Validate DocType JSON
        run: python scripts/validate_doctypes.py

      # frappe / erpnext / propms must never be pip dependencies (Press build exit 167).
      - name: Packaging guard
        run: python scripts/check_packaging.py

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan
        run: gitleaks git --config .gitleaks.toml --redact --verbose .

  frappe-semgrep:
    name: Frappe Semgrep Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Frappe semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run semgrep
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness
